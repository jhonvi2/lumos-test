<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micrófono Hogwarts</title>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; padding: 50px; }
        #status { color: #aaa; }
        .listening { color: #4CAF50; font-weight: bold; }
    </style>
</head>
<body>
    <h1>Sala Común</h1>
    <p id="status">Iniciando magia...</p>
    <p id="transcript"></p>

    <script>
        // CAMBIA ESTO POR LA IP DE TU PC (El falso ESP32)
        const IP_ESP32 = "http://192.1.176:8080"; 

        let wakeLock = null;

        // 1. Evitar que la pantalla se apague (Wake Lock API)
        async function keepScreenOn() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                console.log('Pantalla bloqueada encendida');
            } catch (err) {
                console.error(`${err.name}, ${err.message}`);
            }
        }
        keepScreenOn();

        // 2. Configurar el reconocimiento de voz continuo
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        
        recognition.lang = 'es-ES';
        recognition.continuous = true; // Que no pare al terminar una frase
        recognition.interimResults = false;

        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');

        recognition.onstart = function() {
            statusEl.innerHTML = "<span class='listening'>Escuchando hechizos...</span>";
        };

        recognition.onresult = function(event) {
            const current = event.resultIndex;
            const transcript = event.results[current][0].transcript.toLowerCase().trim();
            transcriptEl.innerText = "Has dicho: " + transcript;

            // Buscar la palabra clave
            if (transcript.includes("lumos")) {
                document.body.style.backgroundColor = "#fff";
                document.body.style.color = "#000";
                
                // Enviar la petición al "ESP32"
                fetch(`${IP_ESP32}/lumos`)
                    .then(response => console.log("Orden enviada al ESP32"))
                    .catch(error => console.error("Error de red:", error));
            }
        };

        // 3. El truco para que NUNCA deje de escuchar
        recognition.onend = function() {
            statusEl.innerText = "Reiniciando escucha...";
            // Si se corta por silencio, lo volvemos a arrancar inmediatamente
            setTimeout(() => recognition.start(), 100); 
        };

        recognition.onerror = function(event) {
            console.error("Error de voz: ", event.error);
        };

        // Arrancar
        recognition.start();
    </script>
</body>
</html>
