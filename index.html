<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Micrófono Hogwarts</title>
    <style>
        body { background-color: #111; color: white; font-family: sans-serif; text-align: center; padding: 50px; transition: 0.5s; }
        #status { color: #aaa; margin-top: 20px; font-size: 1.2em; }
        .listening { color: #4CAF50; font-weight: bold; }
        button { padding: 15px 30px; font-size: 1.2em; background-color: #4CAF50; color: white; border: none; border-radius: 10px; cursor: pointer; margin-bottom: 20px;}
    </style>
</head>
<body>
    <h1>Sala Común</h1>
    <button id="btn-start">Toca para activar la Magia</button>
    <p id="status">Esperando...</p>
    <p id="transcript"></p>

    <script>
        // TU URL DE NGROK
        const IP_ESP32 = "https://tinderbox-encode-playmaker.ngrok-free.dev"; 

        let wakeLock = null;
        const statusEl = document.getElementById('status');
        const transcriptEl = document.getElementById('transcript');
        const btnStart = document.getElementById('btn-start');

        // Configurar el reconocimiento de voz
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = new SpeechRecognition();
        
        recognition.lang = 'es-ES';
        recognition.continuous = true; 
        recognition.interimResults = false;

        recognition.onstart = function() {
            statusEl.innerHTML = "<span class='listening'>Escuchando hechizos...</span>";
            btnStart.style.display = "none"; // Ocultar botón al escuchar
        };

        recognition.onresult = function(event) {
            const current = event.resultIndex;
            const transcript = event.results[current][0].transcript.toLowerCase().trim();
            transcriptEl.innerText = "Has dicho: " + transcript;

            if (transcript.includes("lumos")) {
                document.body.style.backgroundColor = "#fff";
                document.body.style.color = "#000";
                statusEl.innerText = "Enviando hechizo..."; 
                
                fetch(`${IP_ESP32}/lumos`, {
                    method: 'GET',
                    headers: { "ngrok-skip-browser-warning": "true" }
                })
                .then(response => {
                    if(response.ok) statusEl.innerText = "¡Luz encendida con éxito!";
                    else statusEl.innerText = "Error HTTP: " + response.status;
                })
                .catch(error => statusEl.innerText = "Fallo de red: " + error.message);
            }
        };

        recognition.onend = function() {
            // Si se corta, volvemos a arrancar
            setTimeout(() => recognition.start(), 100); 
        };

        // Arrancar SOLO cuando se pulsa el botón
        btnStart.addEventListener('click', async () => {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
            } catch (err) { console.error("Wake Lock falló"); }
            
            recognition.start();
        });
    </script>
</body>
</html>
